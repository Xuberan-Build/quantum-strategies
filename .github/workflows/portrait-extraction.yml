name: Portrait extraction queue drain

# Drains portrait_update_queue by calling the Vercel endpoint
# /api/cron/portrait-extraction-queue every 5 minutes.
#
# Why GitHub Actions and not Vercel cron:
#   Vercel's Hobby plan caps cron cadence to once per day with
#   ±59-minute scheduling jitter. The portrait extraction worker is
#   async-tolerant but needs ~5–15 minute responsiveness so that
#   cross-product context is fresh when a user finishes a rite and
#   immediately starts the next one. GitHub Actions cron is free at
#   this volume on any plan (public repos: unlimited minutes; private:
#   2,000 free min/month, well above what this workflow consumes) and
#   has its own modest scheduling drift that is invisible to users.
#
# Required GitHub repository secrets:
#   PRODUCTION_URL   — the public URL of the deployed Vercel app
#                      (e.g. https://app.quantumstrategies.online),
#                      no trailing slash.
#   CRON_SECRET      — the same value set in Vercel's environment
#                      variables. The Vercel route validates this in
#                      the Authorization header.

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron evaluates UTC; portrait
    # extraction is timezone-agnostic so this is fine as-is.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevent overlapping runs if one drain takes longer than 5 minutes
# (it shouldn't — the worker processes up to 5 rows sequentially,
# each ~3–10 s — but the guard costs nothing).
concurrency:
  group: portrait-extraction-queue
  cancel-in-progress: false

jobs:
  drain:
    name: Call drain endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify secrets are configured
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL secret is not set on this repository"
            echo "Set it under Settings → Secrets and variables → Actions"
            echo "Value should be the full deployment URL with no trailing slash,"
            echo "e.g. https://app.quantumstrategies.online"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set on this repository"
            echo "Set it under Settings → Secrets and variables → Actions"
            echo "Value MUST match the CRON_SECRET env var in Vercel."
            exit 1
          fi

      - name: Drain portrait_update_queue
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -o pipefail
          response=$(curl --silent --show-error --max-time 60 \
            --write-out '\n__STATUS__%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/cron/portrait-extraction-queue")
          status=$(echo "$response" | grep -o '__STATUS__[0-9]*' | sed 's/__STATUS__//')
          body=$(echo "$response" | sed 's/__STATUS__[0-9]*//' | sed '/^$/d')

          echo "## Drain result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**HTTP status:** \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "200" ]; then
            echo "::error::Drain endpoint returned non-200 status: $status"
            exit 1
          fi
